<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Board Management - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #070d19;
            --card: #0f172a;
            --primary: #38bdf8;
            --text: #ffffff;
            --subtext: #94a3b8;
            --border: rgba(56, 189, 248, 0.25);
        }

        /* Front-End Security: Disable Text Selection & Dragging */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-drag: none; 
        }

        input, textarea, select { user-select: auto; }

        /* Mobile White-Bar & Scroll Glitch Fix */
        html, body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            padding: 25px 15px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 80%);
            z-index: -1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Desktop vs Mobile Container Width Control */
        .container { 
            width: 100%; 
            max-width: 1050px; /* Laptop/PC पर पूरा प्रॉपर बड़ा लुक */
            padding-bottom: 50px; 
            animation: fadeIn 0.4s ease-out; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Top Bar */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 18px 24px; background: rgba(15, 23, 42, 0.85); 
            border: 1px solid var(--border); border-radius: 16px; 
            margin-bottom: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
            backdrop-filter: blur(8px); 
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; color: var(--text); }
        .brand i { color: var(--primary); font-size: 22px; background: rgba(56, 189, 248, 0.1); padding: 10px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); }
        
        .btn-home { 
            background: rgba(56, 189, 248, 0.1); color: var(--primary); 
            border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; 
            font-size: 13.5px; font-weight: 600; text-decoration: none; 
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; cursor: pointer; 
        }
        .btn-home:hover { background: var(--primary); color: var(--bg); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }

        /* Type XYZ Menu Strips */
        .strip { 
            display: flex; align-items: center; background: rgba(15, 23, 42, 0.65); 
            border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 16px; 
            padding: 22px 24px; margin-bottom: 18px; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); backdrop-filter: blur(5px); 
        }
        .strip:hover { transform: translateY(-4px); background: rgba(15, 23, 42, 0.95); border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2); }
        .strip:active { transform: scale(0.98); }
        
        .strip-icon { width: 56px; height: 56px; background: rgba(56, 189, 248, 0.1); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 24px; margin-right: 20px; flex-shrink: 0; border: 1px solid var(--border); transition: all 0.3s ease; }
        .strip:hover .strip-icon { background: var(--primary); color: var(--bg); }
        .strip-text h3 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
        .strip-text p { font-size: 13px; color: var(--subtext); }
        .strip-arrow { margin-left: auto; color: var(--primary); font-size: 18px; transition: transform 0.3s; }
        .strip:hover .strip-arrow { transform: translateX(6px); }

        /* Modals (Popups) - Perfectly Centered & No Overlaps */
        .modal { display: none; position: fixed; inset: 0; background: rgba(7, 13, 25, 0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-content { 
            background: var(--card); width: 100%; max-width: 650px; 
            border-radius: 20px; border: 1px solid var(--border); overflow: hidden; 
            display: flex; flex-direction: column; max-height: 90vh; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); transform: scale(0.95); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .modal.active .modal-content { transform: scale(1); }
        
        .modal-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; background: rgba(56, 189, 248, 0.05); }
        .modal-header h2 { font-size: 18px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .close-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--subtext); width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; }
        .close-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; transform: rotate(90deg); }

        .modal-body { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }

        /* Forms inside Modal */
        label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-box { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 13px 16px; border-radius: 10px; font-size: 14px; outline: none; color-scheme: dark; transition: all 0.3s ease; }
        .input-box:focus { border-color: var(--primary); background: rgba(30, 41, 59, 0.6); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }
        select.input-box option { background-color: var(--card); color: var(--text); }
        textarea.input-box { resize: vertical; min-height: 100px; line-height: 1.5; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .file-box { border: 1px dashed var(--primary); background: rgba(56, 189, 248, 0.05); padding: 18px; border-radius: 10px; text-align: center; position: relative; cursor: pointer; transition: all 0.2s; }
        .file-box:hover { background: rgba(56, 189, 248, 0.1); }
        .file-box input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-msg { color: var(--primary); font-size: 13.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .optional-tag { font-size: 10.5px; color: #64748b; font-weight: 400; text-transform: none; }

        .action-btn { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 15px; border-radius: 10px; font-size: 14.5px; font-weight: 600; text-align: center; width: 100%; cursor: pointer; margin-top: 5px; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .action-btn:hover { background: var(--primary); color: var(--bg); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3); }
        .action-btn:active { transform: scale(0.97); }
        .action-btn:disabled { opacity: 0.6; pointer-events: none; }

        /* Notice List Elements - No Overlapping Design */
        .list-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-left: 4px solid var(--primary); padding: 18px; border-radius: 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; gap: 15px; }
        .list-item:hover { border-color: rgba(56, 189, 248, 0.35); background: rgba(30, 41, 59, 0.85); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
        .list-info { flex: 1; min-width: 0; }
        .list-info h4 { font-size: 15px; color: var(--text); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .list-info p { font-size: 12.5px; color: var(--subtext); line-height: 1.5; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .list-meta { font-size: 11px; color: var(--primary); font-weight: 500; }

        .btn-group { display: flex; gap: 10px; flex-shrink: 0; }
        .btn-view { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-view:hover { background: var(--primary); color: var(--bg); }
        
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .btn-delete:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .no-data { color: var(--subtext); font-size: 13.5px; text-align: center; padding: 40px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 14px; background: rgba(0,0,0,0.2); }

        /* Strict Mobile View Responsiveness - Zero Overlap */
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; gap: 16px; }
            .container { max-width: 100%; padding: 0 5px; }
            .list-item { flex-direction: column; align-items: flex-start; gap: 12px; padding: 15px; }
            .list-info h4 { white-space: normal; }
            .btn-group { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- UI Security Guard -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>

    <div class="container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-bullhorn"></i>
                <span>Notice Board Management</span>
            </div>
            <!-- Exact Link back to Teacher Dashboard -->
            <a href="teacher_dashboard.html" class="btn-home">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <!-- TYPE XYZ STRIPS -->
        <div class="strip" onclick="openModal('createNoticeModal')">
            <div class="strip-icon"><i class="fa-solid fa-circle-plus"></i></div>
            <div class="strip-text">
                <h3>Publish New Notice</h3>
                <p>Broadcast school news and updates</p>
            </div>
            <i class="fa-solid fa-chevron-right strip-arrow"></i>
        </div>

        <div class="strip" onclick="openModal('manageNoticeModal')">
            <div class="strip-icon"><i class="fa-solid fa-list-check"></i></div>
            <div class="strip-text">
                <h3>Manage Notices Database</h3>
                <p>View or delete active school circulars</p>
            </div>
            <i class="fa-solid fa-chevron-right strip-arrow"></i>
        </div>

    </div>

    <!-- ================= MODALS ================= -->

    <!-- 1. Create Notice Modal -->
    <div class="modal" id="createNoticeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-bullhorn"></i> Publish Notice</h2>
                <button class="close-btn" onclick="closeModal('createNoticeModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div>
                    <label>Notice Heading / Title (Mandatory)</label>
                    <input type="text" id="noticeTitle" class="input-box" placeholder="e.g. Annual Sports Meet 2026">
                </div>
                
                <div class="form-row">
                    <div>
                        <label>Target Class</label>
                        <select id="noticeClass" class="input-box">
                            <option value="All" selected>All Classes</option>
                            <option value="Nursery">Nursery</option>
                            <option value="LKG">LKG</option>
                            <option value="UKG">UKG</option>
                            <option value="1">Class 1st</option>
                            <option value="2">Class 2nd</option>
                            <option value="3">Class 3rd</option>
                            <option value="4">Class 4th</option>
                            <option value="5">Class 5th</option>
                            <option value="6">Class 6th</option>
                            <option value="7">Class 7th</option>
                            <option value="8">Class 8th</option>
                            <option value="9">Class 9th</option>
                            <option value="10">Class 10th</option>
                            <option value="11">Class 11th</option>
                            <option value="12">Class 12th</option>
                        </select>
                    </div>
                    <div>
                        <label>Importance / Priority</label>
                        <select id="noticePriority" class="input-box">
                            <option value="Normal" selected>Normal Update</option>
                            <option value="Important">Important / Urgent</option>
                            <option value="Warning">Warning / Alert</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label>Notice Content / Details (Mandatory)</label>
                    <textarea id="noticeDesc" class="input-box" placeholder="Write complete circular details here..."></textarea>
                </div>

                <div>
                    <label>Attach Circular Document <span class="optional-tag">(Max 1.5MB or Link)</span></label>
                    <div class="file-box">
                        <input type="file" id="noticeFileInput" accept="application/pdf,image/*" onchange="handleNoticeFile(event)">
                        <div class="file-msg" id="noticeFileStatus"><i class="fa-solid fa-file-arrow-up"></i> Select PDF or Image File</div>
                    </div>
                    <input type="url" id="noticeLinkInput" class="input-box" placeholder="Or paste Google Drive link here..." style="margin-top: 12px;">
                </div>

                <button class="action-btn" id="btnPublishNotice" onclick="publishNotice()">
                    <i class="fa-solid fa-paper-plane"></i> Broadcast Notice
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Manage Notices Modal -->
    <div class="modal" id="manageNoticeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-list-check"></i> Manage Active Notices</h2>
                <button class="close-btn" onclick="closeModal('manageNoticeModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" style="background: rgba(0,0,0,0.15);">
                <div id="manageNoticesList" style="max-height: 420px; overflow-y: auto; padding-right: 4px;">
                    <div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Loading notices...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let uploadedNoticeDataUrl = '';

        window.onload = function() {
            listenNotices();
        };

        function openModal(id) { 
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }
        
        function closeModal(id) { 
            const modal = document.getElementById(id);
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function handleNoticeFile(event) {
            const file = event.target.files[0];
            const statusBox = document.getElementById('noticeFileStatus');
            
            if (!file) {
                uploadedNoticeDataUrl = '';
                statusBox.innerHTML = '<i class="fa-solid fa-file-arrow-up"></i> Select PDF or Image File';
                return;
            }

            if (file.size > 1.5 * 1024 * 1024) {
                alert("⚠️ File size exceeds 1.5 MB. Please use a Google Drive link.");
                event.target.value = '';
                uploadedNoticeDataUrl = '';
                statusBox.innerHTML = '<i class="fa-solid fa-file-arrow-up"></i> Select PDF or Image File';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedNoticeDataUrl = e.target.result;
                statusBox.innerHTML = `<i class="fa-solid fa-check" style="color:#4ade80;"></i> Attached: ${file.name}`;
            };
            reader.readAsDataURL(file);
        }

        async function publishNotice() {
            const title = document.getElementById('noticeTitle').value.trim();
            const targetClass = document.getElementById('noticeClass').value;
            const priority = document.getElementById('noticePriority').value;
            const description = document.getElementById('noticeDesc').value.trim();
            const linkInput = document.getElementById('noticeLinkInput').value.trim();

            if (!title || !description) return alert("Notice Title and Description are mandatory!");

            const finalFileUrl = uploadedNoticeDataUrl || linkInput;

            const btn = document.getElementById('btnPublishNotice');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Publishing...`;

            try {
                const author = localStorage.getItem('loggedInTeacher') || localStorage.getItem('loggedInUser') || 'Faculty Member';
                
                await db.collection('notices').add({
                    title: title,
                    targetClass: targetClass,
                    priority: priority,
                    description: description,
                    fileUrl: finalFileUrl || '',
                    author: author,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('noticeTitle').value = '';
                document.getElementById('noticeDesc').value = '';
                document.getElementById('noticeLinkInput').value = '';
                document.getElementById('noticeFileInput').value = '';
                document.getElementById('noticeFileStatus').innerHTML = '<i class="fa-solid fa-file-arrow-up"></i> Select PDF or Image File';
                uploadedNoticeDataUrl = '';

                alert("✅ Notice Published Successfully!");
                closeModal('createNoticeModal');
            } catch (error) {
                alert("Failed to publish notice.");
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Broadcast Notice`;
        }

        function openSafePDF(url) {
            if (!url) return;
            if (url.startsWith('data:')) {
                try {
                    const parts = url.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const bstr = atob(parts[1]);
                    let n = bstr.length; const u8arr = new Uint8Array(n);
                    while (n--) { u8arr[n] = bstr.charCodeAt(n); }
                    const blob = new Blob([u8arr], { type: mime });
                    window.open(URL.createObjectURL(blob), '_blank');
                } catch (e) { window.open(url, '_blank'); }
            } else {
                window.open(url, '_blank');
            }
        }

        function listenNotices() {
            db.collection('notices').onSnapshot(snapshot => {
                const manageList = document.getElementById('manageNoticesList');
                
                let temp = [];
                snapshot.forEach(doc => temp.push({id: doc.id, ...doc.data()}));
                temp.sort((a,b) => (b.timestamp?.seconds||0) - (a.timestamp?.seconds||0));

                manageList.innerHTML = temp.length === 0 ? `<div class="no-data">No notices published yet.</div>` : '';

                temp.forEach(data => {
                    const safeUrl = data.fileUrl ? data.fileUrl.replace(/'/g, "\\'") : '';
                    let priorityColor = "var(--primary)";
                    if(data.priority === "Important") priorityColor = "#fbbf24";
                    if(data.priority === "Warning") priorityColor = "#ef4444";
                    
                    manageList.innerHTML += `
                        <div class="list-item">
                            <div class="list-info">
                                <h4><i class="fa-solid fa-bullhorn" style="color:${priorityColor};"></i> ${data.title || 'Notice'}</h4>
                                <p>${data.description || ''}</p>
                                <div class="list-meta">Class: ${data.targetClass || 'All'} • Priority: ${data.priority || 'Normal'}</div>
                            </div>
                            <div class="btn-group">
                                ${safeUrl ? `<button class="btn-view" onclick="openSafePDF('${safeUrl}')"><i class="fa-solid fa-eye"></i> View</button>` : ''}
                                <button class="btn-delete" onclick="deleteNotice('${data.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        async function deleteNotice(id) {
            if (!confirm("Are you sure you want to delete this notice permanently?")) return;
            try { await db.collection('notices').doc(id).delete(); } 
            catch (e) { alert("Error deleting notice."); }
        }
    </script>
</body>
</html>
