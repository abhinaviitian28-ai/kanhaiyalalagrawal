<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Assignments - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === CORE SETTINGS & NO SCROLLBAR === */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-drag: none;
            scrollbar-width: none; -ms-overflow-style: none;
        }

        input, textarea, select { user-select: auto; }
        ::-webkit-scrollbar { display: none; width: 0; background: transparent; }

        body {
            background-color: #070d19; color: #f8fafc;
            min-height: 100vh; display: flex; justify-content: center;
            padding: 16px 12px; position: relative; overscroll-behavior-y: none;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 75%);
            z-index: -1;
        }

        /* Exact Student Reference Width */
        .container { width: 100%; max-width: 800px; padding-bottom: 40px; }

        .animated-btn { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; will-change: transform; }
        .animated-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .animated-btn:active { transform: scale(0.97); }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.75); padding: 12px 16px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.25); backdrop-filter: blur(10px); flex-wrap: wrap; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: #38bdf8; letter-spacing: 0.3px; }
        .brand i { background: rgba(56, 189, 248, 0.15); padding: 8px 10px; border-radius: 9px; color: #38bdf8; font-size: 15px; border: 1px solid rgba(56, 189, 248, 0.3); }
        
        .btn-dashboard { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); text-decoration: none; padding: 7px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-dashboard:hover { background: rgba(56, 189, 248, 0.25); color: #fff; }

        /* Action Strip (Replaces Popup logic) */
        .action-strip { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; cursor: pointer; transition: 0.25s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .action-strip:hover { border-color: #38bdf8; background: #1e293b; transform: translateY(-2px); }
        
        .strip-left { display: flex; align-items: center; gap: 14px; }
        .strip-icon { width: 44px; height: 44px; background: rgba(56, 189, 248, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 18px; flex-shrink: 0; border: 1px solid rgba(56, 189, 248, 0.2); }
        .strip-text h3 { font-size: 15px; font-weight: 600; color: #f8fafc; margin-bottom: 3px; }
        .strip-text p { font-size: 12px; color: #94a3b8; }

        /* Inline Form Card */
        .form-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 24px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px); }
        .form-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; margin-bottom: 20px; }
        .form-header h3 { font-size: 16px; font-weight: 600; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .btn-close-form { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-close-form:hover { background: #ef4444; color: #fff; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-field label { font-size: 11.5px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-box { width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.12); color: #f8fafc; padding: 12px 14px; border-radius: 10px; font-size: 13px; outline: none; transition: 0.2s; color-scheme: dark; }
        .input-box:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.15); }
        select.input-box { cursor: pointer; }
        textarea.input-box { resize: vertical; min-height: 100px; line-height: 1.5; }

        .file-box { border: 1px dashed #38bdf8; background: rgba(56, 189, 248, 0.05); padding: 18px; border-radius: 10px; text-align: center; position: relative; cursor: pointer; transition: 0.2s; }
        .file-box:hover { background: rgba(56, 189, 248, 0.1); }
        .file-box input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-msg { color: #38bdf8; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .btn-submit { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; border: 1px solid rgba(56, 189, 248, 0.35); padding: 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3); }
        .btn-submit:hover { background: #0369a1; transform: translateY(-1px); }

        /* Search Section */
        .controls-card { background: rgba(30, 41, 59, 0.65); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 12px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); backdrop-filter: blur(8px); display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box { position: relative; flex-grow: 1; min-width: 200px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 13px; }
        .search-box input { width: 100%; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.12); color: #f8fafc; padding: 10px 14px 10px 38px; border-radius: 10px; font-size: 12.5px; outline: none; transition: 0.25s; }
        .search-box input:focus { border-color: #38bdf8; }

        /* Assignment Cards List (Student Ref Match) */
        .list-container { display: flex; flex-direction: column; gap: 12px; }

        .card { background: rgba(30, 41, 59, 0.65); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 16px; transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(8px); }
        .card:hover { border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
        .card-title-group { display: flex; align-items: center; gap: 10px; }
        .card-icon { width: 36px; height: 36px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 9px; display: flex; justify-content: center; align-items: center; font-size: 15px; color: #38bdf8; flex-shrink: 0; }
        .sub-pill { font-size: 10px; font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); padding: 2px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
        .card-title { font-size: 14px; font-weight: 600; color: #f8fafc; margin-top: 3px; line-height: 1.3; }

        .card-date { background: rgba(234, 179, 8, 0.15); border: 1px solid rgba(234, 179, 8, 0.3); padding: 4px 8px; border-radius: 7px; font-size: 11px; color: #fbbf24; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 5px; }

        .card-preview { font-size: 12.5px; color: #cbd5e1; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 12px; margin-top: 8px; }

        .target-info { font-size: 11.5px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
        .target-info i { color: #38bdf8; }

        .card-actions { display: flex; gap: 8px; }
        .btn-action { background: #0f172a; border: 1px solid rgba(255,255,255,0.12); color: #cbd5e1; padding: 7px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; text-decoration: none; }
        .btn-action:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #38bdf8; }
        .btn-action.delete { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }
        .btn-action.delete:hover { background: #ef4444; color: #fff; }

        .empty-state { text-align: center; padding: 45px 20px; background: rgba(30, 41, 59, 0.4); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 14px; }
        .empty-state i { font-size: 38px; color: #38bdf8; margin-bottom: 12px; opacity: 0.85; }
        .empty-state h3 { font-size: 15px; font-weight: 600; margin-bottom: 5px; }

        @media (max-width: 600px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .form-row { grid-template-columns: 1fr; gap: 14px; margin-bottom: 0; }
            .card-header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .card-footer { flex-direction: column; align-items: flex-start; gap: 12px; }
            .card-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) return false; 
        }
    </script>

    <div class="container fade-in">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-book-open"></i>
                <span>Assignment Control Panel</span>
            </div>
            <a href="teacher_dashboard.html" class="btn-dashboard animated-btn">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <!-- Action Strip to open Inline Form -->
        <div class="action-strip animated-btn" id="stripCreate" onclick="toggleForm('createForm')">
            <div class="strip-left">
                <div class="strip-icon"><i class="fa-solid fa-folder-plus"></i></div>
                <div class="strip-text">
                    <h3>Publish New Assignment</h3>
                    <p>Assign tasks, projects, or homework to classes.</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-down" style="color: #64748b;"></i>
        </div>

        <!-- INLINE FORM -->
        <div class="form-card hidden fade-in" id="createForm">
            <div class="form-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> Draft Assignment</h3>
                <button class="btn-close-form" onclick="toggleForm('createForm')"><i class="fa-solid fa-xmark"></i> Close</button>
            </div>
            
            <div class="form-row">
                <div class="form-field">
                    <label>Assignment Title</label>
                    <input type="text" id="asTitle" class="input-box" placeholder="e.g. Physics Numericals Ch-1">
                </div>
                <div class="form-field">
                    <label>Subject / Topic</label>
                    <input type="text" id="asSubject" class="input-box" placeholder="e.g. Physics">
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label>Target Class</label>
                    <select id="asClass" class="input-box" onchange="toggleStreamLogic()">
                        <option value="All">All Classes</option>
                        <option value="Nursery">Nursery</option>
                        <option value="LKG">LKG</option>
                        <option value="UKG">UKG</option>
                        <option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option>
                        <option value="4">4th</option><option value="5">5th</option><option value="6">6th</option>
                        <option value="7">7th</option><option value="8">8th</option><option value="9">9th</option>
                        <option value="10">10th</option><option value="11">11th</option><option value="12">12th</option>
                    </select>
                </div>
                <div class="form-field hidden" id="streamGroup">
                    <label>Target Stream</label>
                    <select id="asStream" class="input-box">
                        <option value="All">All Streams</option>
                        <option value="PCM">Science (PCM)</option>
                        <option value="PCB">Science (PCB)</option>
                        <option value="Commerce">Commerce</option>
                        <option value="Arts">Humanities / Arts</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label>Section</label>
                    <select id="asSection" class="input-box">
                        <option value="All">All Sections</option>
                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                        <option value="C">Section C</option>
                        <option value="D">Section D</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Due Date</label>
                    <input type="date" id="asDueDate" class="input-box">
                </div>
            </div>

            <div class="form-field">
                <label>Instructions & Details</label>
                <textarea id="asDesc" class="input-box" placeholder="Write specific task details, rules, or questions here..."></textarea>
            </div>

            <div class="form-field">
                <!-- ENGINE FIX 1: Max 700KB -->
                <label>Attachment (PDF/Image - Max 700KB) OR Link</label>
                <div class="file-box">
                    <input type="file" accept="application/pdf,image/*" onchange="handleFileUpload(event)">
                    <div class="file-msg" id="fileStatus"><i class="fa-solid fa-paperclip"></i> Tap to attach file</div>
                </div>
                <input type="url" id="asLink" class="input-box" placeholder="Or paste Google Drive link here..." style="margin-top: 10px;">
            </div>

            <button class="btn-submit" id="btnPublish" onclick="publishAssignment()"><i class="fa-solid fa-paper-plane"></i> Publish Assignment</button>
        </div>

        <!-- Search Box -->
        <div class="controls-card fade-in">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search uploaded assignments by title, subject or class..." onkeyup="handleSearch()">
            </div>
        </div>

        <!-- Assignments Container -->
        <div class="list-container" id="assignmentsContainer">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <h3>Loading Database...</h3>
            </div>
        </div>

    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let allAssignments = [];
        let searchQuery = "";
        let uploadedFileBase64 = "";

        window.onload = function() {
            listenAssignmentsLive();
        };

        function toggleForm(id) {
            const form = document.getElementById(id);
            if(form.classList.contains('hidden')) {
                form.classList.remove('hidden');
                document.getElementById('stripCreate').style.display = 'none';
            } else {
                form.classList.add('hidden');
                document.getElementById('stripCreate').style.display = 'flex';
                // Reset form fields
                uploadedFileBase64 = "";
                document.getElementById('fileStatus').innerHTML = '<i class="fa-solid fa-paperclip"></i> Tap to attach file';
            }
        }

        function toggleStreamLogic() {
            const classVal = document.getElementById('asClass').value;
            const streamGroup = document.getElementById('streamGroup');
            if (classVal === '11' || classVal === '12') {
                streamGroup.classList.remove('hidden');
            } else {
                streamGroup.classList.add('hidden');
            }
        }

        // === ENGINE FIX 1: SECURE FILE LIMIT ===
        function handleFileUpload(event) {
            const file = event.target.files[0];
            const statusBox = document.getElementById('fileStatus');
            
            if (!file) {
                uploadedFileBase64 = "";
                statusBox.innerHTML = '<i class="fa-solid fa-paperclip"></i> Tap to attach file';
                return;
            }

            if (file.size > 700 * 1024) {
                alert("⚠️ File exceeds 700KB. Firestore database cannot save PDFs larger than this directly. Please compress it or use a Google Drive link below.");
                event.target.value = '';
                uploadedFileBase64 = "";
                statusBox.innerHTML = '<i class="fa-solid fa-paperclip"></i> Tap to attach file';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = e => {
                uploadedFileBase64 = e.target.result;
                statusBox.innerHTML = `<i class="fa-solid fa-check" style="color:#4ade80;"></i> Attached`;
            };
            reader.readAsDataURL(file);
        }

        async function publishAssignment() {
            const title = document.getElementById('asTitle').value.trim();
            const subject = document.getElementById('asSubject').value.trim();
            const desc = document.getElementById('asDesc').value.trim();
            const dueDate = document.getElementById('asDueDate').value;
            
            const cls = document.getElementById('asClass').value;
            const sec = document.getElementById('asSection').value;
            const stm = (cls === '11' || cls === '12') ? document.getElementById('asStream').value : 'All';
            
            const link = document.getElementById('asLink').value.trim();
            const fileUrl = uploadedFileBase64 || link;

            if(!title || !subject || !desc) {
                alert("Please fill Title, Subject, and Instructions.");
                return;
            }

            const btn = document.getElementById('btnPublish');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Publishing...`;
            btn.disabled = true;

            const teacherName = localStorage.getItem('loggedInTeacher') || localStorage.getItem('loggedInUser') || 'Faculty Member';

            try {
                await db.collection('assignments').add({
                    title: title,
                    subject: subject,
                    description: desc,
                    dueDate: dueDate,
                    class: cls,
                    section: sec,
                    stream: stm,
                    teacherName: teacherName,
                    link: fileUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("✅ Assignment Published Successfully!");
                
                // Clear Form
                document.getElementById('asTitle').value = '';
                document.getElementById('asSubject').value = '';
                document.getElementById('asDesc').value = '';
                document.getElementById('asDueDate').value = '';
                document.getElementById('asLink').value = '';
                document.getElementById('fileStatus').innerHTML = '<i class="fa-solid fa-paperclip"></i> Tap to attach file';
                uploadedFileBase64 = '';
                
                toggleForm('createForm'); // Close form
            } catch (err) {
                alert("Error publishing assignment. Check connection.");
            }

            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Publish Assignment`;
            btn.disabled = false;
        }

        // === ENGINE FIX 2: FETCH & SYNC (CRASH-PROOF) ===
        function listenAssignmentsLive() {
            // Removed orderBy to prevent missing documents bug
            db.collection("assignments").onSnapshot((snapshot) => {
                allAssignments = [];
                snapshot.forEach(doc => {
                    allAssignments.push({ id: doc.id, ...doc.data() });
                });
                
                // Safe JS Sorting
                allAssignments.sort((a,b) => (b.createdAt?.seconds || Infinity) - (a.createdAt?.seconds || Infinity));
                
                renderList();
            });
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderList();
        }

        // === ENGINE FIX 3: SAFE SEARCH LOGIC ===
        function renderList() {
            const container = document.getElementById('assignmentsContainer');
            container.innerHTML = "";

            let filtered = allAssignments.filter(item => {
                // Safe array join to prevent null/undefined crash
                let textArray = [
                    item.title, item.subject, item.class, item.section, item.stream, item.description
                ].map(v => String(v || '').toLowerCase());
                
                return textArray.join(' ').includes(searchQuery);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <h3>No Assignments Found</h3>
                        <p>You haven't uploaded anything matching this search.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                let displayDate = item.dueDate || 'N/A';
                try { 
                    if(displayDate !== "N/A") displayDate = new Date(displayDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); 
                } catch(e){}

                const streamTxt = (item.class === '11' || item.class === '12') && item.stream && item.stream !== 'All' ? `(${item.stream})` : '';

                const card = document.createElement('div');
                card.className = "card fade-in";
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon"><i class="fa-solid fa-file-lines"></i></div>
                            <div>
                                <span class="sub-pill">${item.subject || 'General'}</span>
                                <h3 class="card-title">${item.title || 'Untitled'}</h3>
                            </div>
                        </div>
                        <div class="card-date"><i class="fa-solid fa-hourglass-half"></i> Due: ${displayDate}</div>
                    </div>
                    <div class="card-preview">${item.description || 'No description provided.'}</div>
                    <div class="card-footer">
                        <div class="target-info">
                            <i class="fa-solid fa-users"></i> Target: Class ${item.class || 'All'} ${streamTxt} - Sec ${item.section || 'All'}
                        </div>
                        <div class="card-actions">
                            <a href="${item.link || '#'}" target="_blank" class="btn-action ${!item.link ? 'hidden' : ''}">
                                <i class="fa-solid fa-eye"></i> View Attachment
                            </a>
                            <button class="btn-action delete" onclick="deleteAssignment('${item.id}')">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function deleteAssignment(id) {
            if(!confirm("Are you sure you want to delete this assignment permanently?")) return;
            try {
                await db.collection('assignments').doc(id).delete();
            } catch(e) {
                alert("Failed to delete.");
            }
        }
    </script>
</body>
</html>
