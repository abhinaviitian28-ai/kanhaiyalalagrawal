<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Standing & Ranks - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === SOBER THEME VARIABLES (Matching other pages, extra glow removed) === */
        :root {
            --bg: #070d19;
            --card: #162133;
            --primary: #38bdf8;
            --secondary: #eab308;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --purple: #a855f7;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-drag: none;
            scrollbar-width: none; -ms-overflow-style: none;
        }

        input, textarea, select { user-select: auto; }
        ::-webkit-scrollbar { display: none; width: 0; background: transparent; }

        body {
            background-color: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; justify-content: center;
            padding: 15px; position: relative; overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 80%);
            z-index: -1;
        }

        /* Container matched to 950px */
        .container {
            width: 100%; max-width: 950px; display: flex;
            flex-direction: column; gap: 18px; padding-bottom: 40px;
            animation: pageFade 0.3s ease-out;
        }

        @keyframes pageFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }
        .animated-btn { transition: all 0.2s ease; cursor: pointer; will-change: transform; }
        .animated-btn:hover { transform: translateY(-2px); }
        .animated-btn:active { transform: scale(0.97); }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 14px 20px;
            border-radius: 14px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border); flex-wrap: wrap; gap: 12px;
        }

        .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--text); }
        .brand i { background: rgba(56, 189, 248, 0.1); padding: 9px; border-radius: 10px; color: var(--primary); font-size: 16px; border: 1px solid rgba(56, 189, 248, 0.2); }

        .btn-dashboard {
            background: rgba(56, 189, 248, 0.12); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3);
            text-decoration: none; padding: 8px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-dashboard:hover { background: rgba(56, 189, 248, 0.25); color: #fff; }

        /* Navigation Header */
        .nav-header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .btn-back { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-back:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: var(--primary); }
        .page-title { font-size: 16px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Section Cards */
        .section-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 22px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .section-title { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Forms & Inputs */
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 14px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field label { font-size: 11.5px; font-weight: 600; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-box { width: 100%; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.12); color: #ffffff; padding: 12px 14px; border-radius: 10px; font-size: 13px; outline: none; transition: 0.2s; color-scheme: dark; }
        .input-box:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.15); }
        textarea.input-box { resize: vertical; min-height: 80px; }

        .btn-primary { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; border: 1px solid rgba(56, 189, 248, 0.35); padding: 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px; transition: 0.2s; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); background: #0369a1; }

        /* Main Menu Cards (3 Options) */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 10px; }
        .menu-card { background: rgba(30, 41, 59, 0.65); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden; }
        .menu-card::before { content: ''; position: absolute; top:0; left:0; width:4px; height:100%; background: var(--primary); opacity: 0.8; }
        .menu-card:hover { border-color: var(--primary); background: #1e293b; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        
        .menu-icon { width: 50px; height: 50px; background: rgba(56, 189, 248, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px; border: 1px solid rgba(56, 189, 248, 0.2); flex-shrink: 0;}
        .menu-text { flex-grow: 1; }
        .menu-text h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .menu-text p { font-size: 12px; color: var(--subtext); line-height: 1.4; }
        .menu-arrow { font-size: 16px; color: #64748b; transition: 0.3s; }
        .menu-card:hover .menu-arrow { color: var(--primary); transform: translateX(5px); }

        /* Search Box */
        .search-box { position: relative; width: 100%; margin-bottom: 18px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--subtext); }
        .search-input { width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 12px 14px 12px 40px; border-radius: 10px; font-size: 13.5px; outline: none; transition: 0.2s; }
        .search-input:focus { border-color: var(--primary); }

        /* List Cards (Result / Notice Strips) */
        .list-container { display: flex; flex-direction: column; gap: 14px; }
        .result-card { background: rgba(30, 41, 59, 0.65); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 15px; transition: all 0.2s ease; }
        .result-card:hover { border-color: var(--primary); background: #1e293b; }
        
        .result-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .result-left { display: flex; align-items: center; gap: 14px; }
        .result-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); color: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink:0;}
        .result-meta h3 { font-size: 15px; font-weight: 600; color: var(--text); }
        .result-meta p { font-size: 12px; color: var(--subtext); margin-top: 2px; }

        .badge-pill { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
        .badge-pill.gold { background: rgba(234, 179, 8, 0.1); border-color: rgba(234, 179, 8, 0.3); color: var(--secondary); }

        /* Integrated Form inside Card */
        .integrated-form { background: #0f172a; border-radius: 12px; padding: 18px; border: 1px solid rgba(255,255,255,0.05); margin-top: 5px; animation: pageFade 0.2s ease-out;}
        
        .confidential-box { background: rgba(234, 179, 8, 0.05); border: 1px dashed rgba(234, 179, 8, 0.3); padding: 16px; border-radius: 10px; margin-top: 14px; }
        .confidential-box h4 { font-size: 12px; color: var(--secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        .file-box { border: 1px dashed var(--primary); background: rgba(56, 189, 248, 0.05); padding: 14px; border-radius: 8px; text-align: center; position: relative; cursor: pointer; transition: 0.2s; }
        .file-box:hover { background: rgba(56, 189, 248, 0.1); }
        .file-box input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-msg { color: var(--primary); font-size: 12px; font-weight: 600; }

        /* Leaderboard */
        .leaderboard-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;}
        .leaderboard-item { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.65); padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .leader-left { display: flex; align-items: center; gap: 14px; }
        .rank-num { width: 32px; height: 32px; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: 700; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); color: var(--subtext); }
        .rank-num.r1 { background: rgba(234, 179, 8, 0.15); border-color: var(--secondary); color: var(--secondary); }
        .rank-num.r2 { background: rgba(203, 213, 225, 0.15); border-color: rgba(203, 213, 225, 0.3); color: #e2e8f0; }
        .rank-num.r3 { background: rgba(249, 115, 22, 0.15); border-color: rgba(249, 115, 22, 0.3); color: #fb923c; }
        .leader-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .leader-score { font-size: 13px; font-weight: 600; color: var(--primary); background: rgba(56, 189, 248, 0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.2); }

        .btn-see-more { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight
