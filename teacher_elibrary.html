<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage E-Library - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #070d19;
            --card: #0f172a;
            --primary: #38bdf8;
            --text: #ffffff;
            --subtext: #94a3b8;
            --border: rgba(56, 189, 248, 0.25);
        }

        /* Front-End UI Protection */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-drag: none; 
        }

        input, textarea, select { user-select: auto; }

        /* Mobile Fixes */
        html, body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 80%);
            z-index: -1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .container { width: 100%; max-width: 650px; padding-bottom: 30px; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(8px); }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; color: var(--text); }
        .brand i { color: var(--primary); font-size: 18px; background: rgba(56, 189, 248, 0.1); padding: 8px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.2); }
        
        .btn-home { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease; cursor: pointer; }
        .btn-home:hover { background: var(--primary); color: var(--bg); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }

        /* Type XYZ Menu Strips */
        .strip { display: flex; align-items: center; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 12px; padding: 18px 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.15); backdrop-filter: blur(5px); }
        .strip:hover { transform: translateY(-4px); background: rgba(15, 23, 42, 0.9); border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2); }
        .strip:active { transform: scale(0.97); }
        
        .strip-icon { width: 48px; height: 48px; background: rgba(56, 189, 248, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px; margin-right: 15px; flex-shrink: 0; border: 1px solid var(--border); }
        .strip-text h3 { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
        .strip-text p { font-size: 11.5px; color: var(--subtext); }
        .strip-arrow { margin-left: auto; color: var(--primary); font-size: 16px; transition: transform 0.3s; }
        .strip:hover .strip-arrow { transform: translateX(4px); }

        /* Modals (Popups) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(7, 13, 25, 0.85); z-index: 100; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-content { background: var(--card); width: 100%; max-width: 500px; border-radius: 18px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; max-height: 90dvh; box-shadow: 0 15px 40px rgba(0,0,0,0.6); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal.active .modal-content { transform: scale(1); }
        
        .modal-header { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: rgba(56, 189, 248, 0.05); }
        .modal-header h2 { font-size: 15.5px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .close-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--subtext); width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; }
        .close-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; transform: rotate(90deg); }

        .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        /* Forms inside Modal */
        label { font-size: 11px; font-weight: 600; color: var(--subtext); margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-box { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 13px; outline: none; color-scheme: dark; transition: all 0.3s ease; }
        .input-box:focus { border-color: var(--primary); background: rgba(30, 41, 59, 0.6); box-shadow: 0 0 10px rgba(56, 189, 248, 0.15); }
        select.input-box option { background-color: var(--card); color: var(--text); }
        textarea.input-box { resize: vertical; min-height: 80px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .file-box { border: 1px dashed var(--primary); background: rgba(56, 189, 248, 0.05); padding: 15px; border-radius: 10px; text-align: center; position: relative; cursor: pointer; transition: all 0.2s; }
        .file-box:hover { background: rgba(56, 189, 248, 0.1); }
        .file-box input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-msg { color: var(--primary); font-size: 12.5px; font-weight: 500; }
        .optional-tag { font-size: 9px; color: #64748b; font-weight: 400; text-transform: none; }

        .action-btn { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600; text-align: center; width: 100%; cursor: pointer; margin-top: 5px; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .action-btn:hover { background: var(--primary); color: var(--bg); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(56, 189, 248, 0.3); }
        .action-btn:active { transform: scale(0.96); }
        .action-btn:disabled { opacity: 0.6; pointer-events: none; }

        /* Manage List Elements */
        .list-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-left: 4px solid var(--primary); padding: 14px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; gap: 10px; }
        .list-item:hover { border-color: rgba(56, 189, 248, 0.3); background: rgba(30, 41, 59, 0.8); }
        .list-info { flex: 1; min-width: 0; }
        .list-info h4 { font-size: 13.5px; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-info p { font-size: 11px; color: var(--subtext); }

        .btn-group { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-view { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .btn-view:hover { background: var(--primary); color: var(--bg); }
        
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .btn-delete:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .no-data { color: var(--subtext); font-size: 12.5px; text-align: center; padding: 25px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 10px; background: rgba(0,0,0,0.2); }

        @media (max-width: 500px) {
            .form-row { grid-template-columns: 1fr; gap: 12px; }
        }
    </style>
</head>
<body>

    <!-- UI Lock Script -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>

    <div class="container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-book-open"></i>
                <span>Manage E-Library</span>
            </div>
            <a href="teacher_dashboard.html" class="btn-home">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <!-- TYPE XYZ STRIPS -->
        <div class="strip" onclick="openModal('categoryModal')">
            <div class="strip-icon"><i class="fa-solid fa-folder-plus"></i></div>
            <div class="strip-text">
                <h3>Create Subject Category</h3>
                <p>Create folders like 'Physics Notes'</p>
            </div>
            <i class="fa-solid fa-chevron-right strip-arrow"></i>
        </div>

        <div class="strip" onclick="openModal('uploadModal')">
            <div class="strip-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <div class="strip-text">
                <h3>Upload Study Material</h3>
                <p>Upload PDFs or documents inside folders</p>
            </div>
            <i class="fa-solid fa-chevron-right strip-arrow"></i>
        </div>

        <div class="strip" onclick="openModal('manageModal')">
            <div class="strip-icon"><i class="fa-solid fa-list-check"></i></div>
            <div class="strip-text">
                <h3>Manage Library Database</h3>
                <p>View or delete files and categories</p>
            </div>
            <i class="fa-solid fa-chevron-right strip-arrow"></i>
        </div>

    </div>

    <!-- ================= MODALS ================= -->

    <!-- 1. Category Modal -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-folder-plus"></i> New Category Folder</h2>
                <button class="close-btn" onclick="closeModal('categoryModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div>
                    <label>Category / Subject Name (Mandatory)</label>
                    <input type="text" id="catName" class="input-box" placeholder="e.g. Physics Chapter-Wise Notes">
                </div>
                <div class="form-row">
                    <div>
                        <label>Target Class</label>
                        <select id="catClass" class="input-box" onchange="toggleCatStream()">
                            <option value="All" selected>All Classes</option>
                            <option value="Nursery">Nursery</option>
                            <option value="LKG">LKG</option>
                            <option value="UKG">UKG</option>
                            <option value="1">Class 1st</option>
                            <option value="2">Class 2nd</option>
                            <option value="3">Class 3rd</option>
                            <option value="4">Class 4th</option>
                            <option value="5">Class 5th</option>
                            <option value="6">Class 6th</option>
                            <option value="7">Class 7th</option>
                            <option value="8">Class 8th</option>
                            <option value="9">Class 9th</option>
                            <option value="10">Class 10th</option>
                            <option value="11">Class 11th</option>
                            <option value="12">Class 12th</option>
                        </select>
                    </div>
                    <div id="catStreamGroup" style="display: none;">
                        <label>Target Stream</label>
                        <select id="catStream" class="input-box">
                            <option value="All" selected>All Streams</option>
                            <option value="PCM">Science (PCM)</option>
                            <option value="PCB">Science (PCB)</option>
                            <option value="Commerce">Commerce</option>
                            <option value="Arts">Humanities / Arts</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label>Short Description <span class="optional-tag">(Optional)</span></label>
                    <input type="text" id="catDesc" class="input-box" placeholder="Brief info about this folder...">
                </div>
                <button class="action-btn" id="btnSaveCat" onclick="createCategory()">
                    <i class="fa-solid fa-folder-open"></i> Create Category
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Upload Material Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-cloud-arrow-up"></i> Upload Study Material</h2>
                <button class="close-btn" onclick="closeModal('uploadModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div>
                    <label>Select Category Folder (Mandatory)</label>
                    <select id="fileCategory" class="input-box">
                        <option value="" disabled selected>Loading categories...</option>
                    </select>
                </div>
                <div>
                    <label>Document Title / Heading (Mandatory)</label>
                    <input type="text" id="fileTitle" class="input-box" placeholder="e.g. Thermodynamics Part 1 PDF">
                </div>
                <div class="form-row">
                    <div>
                        <label>Target Class</label>
                        <select id="fileClass" class="input-box" onchange="toggleFileStream()">
                            <option value="All" selected>All Classes</option>
                            <option value="Nursery">Nursery</option>
                            <option value="LKG">LKG</option>
                            <option value="UKG">UKG</option>
                            <option value="1">Class 1st</option>
                            <option value="2">Class 2nd</option>
                            <option value="3">Class 3rd</option>
                            <option value="4">Class 4th</option>
                            <option value="5">Class 5th</option>
                            <option value="6">Class 6th</option>
                            <option value="7">Class 7th</option>
                            <option value="8">Class 8th</option>
                            <option value="9">Class 9th</option>
                            <option value="10">Class 10th</option>
                            <option value="11">Class 11th</option>
                            <option value="12">Class 12th</option>
                        </select>
                    </div>
                    <div id="fileStreamGroup" style="display: none;">
                        <label>Target Stream</label>
                        <select id="fileStream" class="input-box">
                            <option value="All" selected>All Streams</option>
                            <option value="PCM">Science (PCM)</option>
                            <option value="PCB">Science (PCB)</option>
                            <option value="Commerce">Commerce</option>
                            <option value="Arts">Humanities / Arts</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label>Instructions <span class="optional-tag">(Optional)</span></label>
                    <textarea id="fileDesc" class="input-box" placeholder="Write any instructions regarding this file..."></textarea>
                </div>
                <div>
                    <label>Attach PDF / Document (Max 1.5MB or Link)</label>
                    <div class="file-box">
                        <input type="file" id="fileInput" accept="application/pdf,image/*,.doc,.docx" onchange="handleFileSelect(event)">
                        <div class="file-msg" id="fileStatus"><i class="fa-solid fa-file-arrow-up"></i> Select Document File</div>
                    </div>
                    <input type="url" id="fileLinkInput" class="input-box" placeholder="Or paste Google Drive link here..." style="margin-top: 10px;">
                </div>
                <button class="action-btn" id="btnUploadFile" onclick="uploadMaterial()">
                    <i class="fa-solid fa-paper-plane"></i> Publish Material
                </button>
            </div>
        </div>
    </div>

    <!-- 3. Manage Library Modal -->
    <div class="modal" id="manageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-list-check"></i> Manage E-Library</h2>
                <button class="close-btn" onclick="closeModal('manageModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" style="background: rgba(0,0,0,0.15);">
                <label style="color:var(--primary);">Active Categories</label>
                <div id="manageCategoriesList" style="margin-bottom: 20px;"></div>

                <label style="color:var(--primary);">Recently Uploaded Files</label>
                <div id="manageFilesList"></div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let uploadedFileDataUrl = '';

        window.onload = function() {
            toggleCatStream();
            toggleFileStream();
            listenCategories();
            listenFiles();
        };

        // Smooth Modal System
        function openModal(id) { 
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }
        
        function closeModal(id) { 
            const modal = document.getElementById(id);
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        // Toggle Stream
        function toggleCatStream() {
            const cls = document.getElementById('catClass').value;
            document.getElementById('catStreamGroup').style.display = (cls === '11' || cls === '12') ? 'block' : 'none';
        }

        function toggleFileStream() {
            const cls = document.getElementById('fileClass').value;
            document.getElementById('fileStreamGroup').style.display = (cls === '11' || cls === '12') ? 'block' : 'none';
        }

        // --- 1. Category Creation ---
        async function createCategory() {
            const name = document.getElementById('catName').value.trim();
            const desc = document.getElementById('catDesc').value.trim();
            const cls = document.getElementById('catClass').value;
            const stream = (cls === '11' || cls === '12') ? document.getElementById('catStream').value : "General";

            if (!name) return alert("Category Name is mandatory!");

            const btn = document.getElementById('btnSaveCat');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Creating...`;

            try {
                await db.collection('library_categories').add({
                    name: name,
                    description: desc || 'Study materials folder',
                    class: cls,
                    stream: stream,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                document.getElementById('catName').value = '';
                document.getElementById('catDesc').value = '';
                alert("✅ Category Created Successfully!");
                closeModal('categoryModal');
            } catch (error) {
                alert("Failed to create category.");
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-folder-open"></i> Create Category`;
        }

        // --- 2. File Upload ---
        function handleFileSelect(event) {
            const file = event.target.files[0];
            const statusBox = document.getElementById('fileStatus');
            
            if (!file) {
                uploadedFileDataUrl = '';
                statusBox.innerHTML = '<i class="fa-solid fa-file-arrow-up"></i> Select Document File';
                return;
            }

            if (file.size > 1.5 * 1024 * 1024) {
                alert("⚠️ File size exceeds 1.5 MB. Please use a Google Drive link.");
                event.target.value = '';
                uploadedFileDataUrl = '';
                statusBox.innerHTML = '<i class="fa-solid fa-file-arrow-up"></i> Select Document File';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedFileDataUrl = e.target.result;
                statusBox.innerHTML = `<i class="fa-solid fa-check" style="color:#10b981;"></i> Attached: ${file.name}`;
            };
            reader.readAsDataURL(file);
        }

        async function uploadMaterial() {
            const category = document.getElementById('fileCategory').value;
            const title = document.getElementById('fileTitle').value.trim();
            const desc = document.getElementById('fileDesc').value.trim();
            const cls = document.getElementById('fileClass').value;
            const stream = (cls === '11' || cls === '12') ? document.getElementById('fileStream').value : "General";
            const linkInput = document.getElementById('fileLinkInput').value.trim();

            if (!category || !title) return alert("Category and Document Title are mandatory!");

            const finalFileUrl = uploadedFileDataUrl || linkInput;
            if (!finalFileUrl) return alert("Please select a file or provide a drive link.");

            const btn = document.getElementById('btnUploadFile');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading...`;

            try {
                await db.collection('library_files').add({
                    category: category,
                    title: title,
                    description: desc || 'Study Material PDF',
                    class: cls,
                    stream: stream,
                    fileUrl: finalFileUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('fileTitle').value = '';
                document.getElementById('fileDesc').value = '';
                document.getElementById('fileLinkInput').value = '';
                document.getElementById('fileInput').value = '';
                document.getElementById('fileStatus').innerHTML = '<i class="fa-solid fa-file-arrow-up"></i> Select Document File';
                uploadedFileDataUrl = '';

                alert("✅ Material Uploaded Successfully!");
                closeModal('uploadModal');
            } catch (error) {
                alert("Failed to upload file.");
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Publish Material`;
        }

        // --- View Safe Base64 PDF Logic ---
        function openSafePDF(url) {
            if (!url) return;
            if (url.startsWith('data:')) {
                try {
                    const parts = url.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const bstr = atob(parts[1]);
                    let n = bstr.length; const u8arr = new Uint8Array(n);
                    while (n--) { u8arr[n] = bstr.charCodeAt(n); }
                    const blob = new Blob([u8arr], { type: mime });
                    window.open(URL.createObjectURL(blob), '_blank');
                } catch (e) { window.open(url, '_blank'); }
            } else {
                window.open(url, '_blank');
            }
        }

        // --- 3. Listeners & Realtime Sorting Fixes ---
        function listenCategories() {
            db.collection('library_categories').onSnapshot(snapshot => {
                const selectElement = document.getElementById('fileCategory');
                const manageList = document.getElementById('manageCategoriesList');
                
                let temp = [];
                snapshot.forEach(doc => temp.push({id: doc.id, ...doc.data()}));
                temp.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
                
                selectElement.innerHTML = '<option value="" disabled selected>-- Select Category --</option>';
                manageList.innerHTML = temp.length === 0 ? `<div class="no-data">No categories exist yet.</div>` : '';

                temp.forEach(data => {
                    const catName = data.name || 'Unnamed';
                    selectElement.innerHTML += `<option value="${catName}">${catName} (Class: ${data.class || 'All'})</option>`;

                    manageList.innerHTML += `
                        <div class="list-item">
                            <div class="list-info">
                                <h4><i class="fa-solid fa-folder"></i> ${catName}</h4>
                                <p>Class: ${data.class || 'All'} • Stream: ${data.stream || 'All'}</p>
                            </div>
                            <button class="btn-delete" onclick="deleteCategory('${data.id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                });
            });
        }

        function listenFiles() {
            db.collection('library_files').onSnapshot(snapshot => {
                const manageList = document.getElementById('manageFilesList');
                
                let temp = [];
                snapshot.forEach(doc => temp.push({id: doc.id, ...doc.data()}));
                temp.sort((a,b) => (b.timestamp?.seconds||0) - (a.timestamp?.seconds||0));

                manageList.innerHTML = temp.length === 0 ? `<div class="no-data">No files uploaded yet.</div>` : '';

                temp.slice(0, 15).forEach(data => {
                    const safeUrl = data.fileUrl ? data.fileUrl.replace(/'/g, "\\'") : '';
                    
                    manageList.innerHTML += `
                        <div class="list-item">
                            <div class="list-info">
                                <h4><i class="fa-solid fa-file-pdf"></i> ${data.title || 'Document'}</h4>
                                <p>Folder: ${data.category} • Class: ${data.class || 'All'}</p>
                            </div>
                            <div class="btn-group">
                                ${safeUrl ? `<button class="btn-view" onclick="openSafePDF('${safeUrl}')"><i class="fa-solid fa-eye"></i></button>` : ''}
                                <button class="btn-delete" onclick="deleteFile('${data.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        async function deleteCategory(id) {
            if (!confirm("Are you sure you want to delete this category?")) return;
            try { await db.collection('library_categories').doc(id).delete(); } 
            catch (e) { alert("Error deleting category."); }
        }

        async function deleteFile(id) {
            if (!confirm("Are you sure you want to delete this material?")) return;
            try { await db.collection('library_files').doc(id).delete(); } 
            catch (e) { alert("Error deleting file."); }
        }
    </script>
