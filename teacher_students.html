<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Directory - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #070d19;
            --card: #0f172a;
            --primary: #38bdf8;
            --text: #ffffff;
            --subtext: #94a3b8;
            --border: rgba(56, 189, 248, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-drag: none;
            /* गंदी डंडी (Scrollbar) को पूरी तरह छिपाने का कोड */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }

        input, textarea, select { user-select: auto; }

        /* Scrollbar Hidden for all elements */
        ::-webkit-scrollbar { display: none; width: 0; background: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh; /* 100dvh for mobile scroll fix */
            display: flex;
            justify-content: center;
            padding: 15px;
            position: relative;
            overscroll-behavior-y: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 80%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 950px; /* Exact Laptop width from reference */
            padding-bottom: 30px;
        }

        /* --- ANIMATIONS (RESTORED EXACTLY) --- */
        .animated-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .animated-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2); }
        .animated-btn:active { transform: scale(0.96); }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Running Announcement Bar */
        .announcement-bar {
            background: rgba(30, 41, 59, 0.6);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }

        .announcement-bar i {
            color: var(--primary);
            font-size: 16px;
            animation: pulseIcon 1.5s infinite;
            flex-shrink: 0;
        }

        @keyframes pulseIcon { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .marquee-container { overflow: hidden; white-space: nowrap; width: 100%; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: marquee 22s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.5);
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--text); }
        .brand i { background: rgba(56, 189, 248, 0.1); padding: 9px; border-radius: 10px; color: var(--primary); font-size: 16px; border: 1px solid rgba(56, 189, 248, 0.2); }

        .header-right-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .btn-dashboard {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
        }
        .btn-dashboard:hover { background: var(--primary); color: var(--bg); }

        /* Section Header & Filters */
        .section-header { 
            background: rgba(30, 41, 59, 0.4); 
            padding: 14px 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.08); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            gap: 12px; 
            backdrop-filter: blur(5px); 
        }
        .section-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--primary); text-transform: uppercase; }

        .filters-container { display: flex; gap: 10px; flex-wrap: wrap; flex-grow: 1; justify-content: flex-end; }
        
        .search-bar-wrapper { position: relative; flex-grow: 1; max-width: 280px; }
        .search-bar-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--subtext); font-size: 13px; }
        
        .search-input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 9px; padding: 10px 14px 10px 36px; color: var(--text); font-size: 13px; outline: none; transition: 0.2s; color-scheme: dark; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        
        select.search-input { padding-left: 14px; max-width: 140px; cursor: pointer; }
        select.search-input option { background: var(--card); color: var(--text); }

        /* Student List Patti (Perfect sizing from reference) */
        .student-list-container { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 500px; padding-bottom: 10px; }
        
        .student-card { 
            background: rgba(30, 41, 59, 0.4); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 14px; 
            padding: 20px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.2); 
            position: relative; 
            overflow: hidden; 
            backdrop-filter: blur(5px); 
        }
        .student-card::before { content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: var(--primary); }
        .student-card:hover { border-color: var(--primary); }

        .student-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .student-title h3 { font-size: 15.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .student-title h3 i { color: var(--primary); }
        
        .badge-status { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--border); padding: 5px 12px; border-radius: 7px; font-size: 11.5px; font-weight: 600; }

        .student-desc-box { background: var(--card); border: 1px solid rgba(255,255,255,0.05); padding: 14px; border-radius: 10px; font-size: 12.5px; color: #cbd5e1; margin-bottom: 14px; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 15px; }
        .student-desc-box div { display: flex; align-items: center; gap: 6px; }
        .student-desc-box i { color: var(--subtext); }

        .student-footer { display: flex; justify-content: flex-end; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 14px; flex-wrap: wrap; gap: 10px; }
        
        /* Action Buttons */
        .action-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
        .action-btn.edit { background: rgba(56, 189, 248, 0.1); color: var(--primary); border-color: var(--border); }
        .action-btn.edit:hover { background: var(--primary); color: var(--bg); }
        .action-btn.delete { background: rgba(239, 68, 68, 0.1); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
        .action-btn.delete:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        /* See More Button */
        .see-more-container { text-align: center; margin: 20px 0; }
        .see-more-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
        .see-more-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--primary); color: var(--primary); }

        .no-data { color: var(--subtext); font-size: 13px; text-align: center; padding: 30px; background: rgba(30, 41, 59, 0.4); border: 1px dashed rgba(255,255,255,0.1); border-radius: 14px; width: 100%; }

        /* Modal / Popups (Exact Reference Match) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 13, 25, 0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px; opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; padding: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); transform: scale(0.95); transition: 0.2s; }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 14px; }
        .modal-header h3 { font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .modal-close { background: transparent; border: none; color: var(--subtext); font-size: 22px; cursor: pointer; transition: 0.2s; }
        .modal-close:hover { color: #ef4444; }

        .modal-body { display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px; }
        .modal-field { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 14px; border-radius: 10px; }
        .modal-field label { font-size: 11px; color: var(--subtext); text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 6px; }
        
        .modal-input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; outline: none; transition: 0.2s; color-scheme: dark; }
        .modal-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        select.modal-input option { background: var(--card); color: var(--text); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-save { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--border); padding: 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { background: var(--primary); color: var(--bg); }

        /* Strict Mobile Fixes */
        @media (max-width: 650px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .header-right-group { width: 100%; justify-content: space-between; }
            .section-header { flex-direction: column; align-items: flex-start; }
            .filters-container { width: 100%; justify-content: space-between; }
            .search-bar-wrapper { max-width: 100%; width: 100%; }
            select.search-input { max-width: 48%; }
            .student-header { flex-direction: column; align-items: flex-start; }
            .student-desc-box { flex-direction: column; align-items: flex-start; gap: 8px; }
            .student-footer { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- Security Guard -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>

    <div class="container">
        
        <!-- Marquee Bar -->
        <div class="announcement-bar animated-btn fade-in">
            <i class="fa-solid fa-bullhorn"></i>
            <div class="marquee-container">
                <div class="marquee-text">
                    Ensure student records, rolls, and sections are updated for the current academic session.
                </div>
            </div>
        </div>

        <!-- Top Bar -->
        <div class="top-bar fade-in">
            <div class="brand">
                <i class="fa-solid fa-users-viewfinder"></i>
                <span>Student Directory Hub</span>
            </div>
            <div class="header-right-group">
                <a href="teacher_dashboard.html" class="btn-dashboard animated-btn">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
            </div>
        </div>

        <!-- Section Header & Search -->
        <div class="section-header fade-in">
            <div class="section-title"><i class="fa-solid fa-address-book"></i> Enrolled Students</div>
            <div class="filters-container">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchBox" class="search-input" placeholder="Search by name, email..." onkeyup="filterStudents()">
                </div>
                <select id="filterClass" class="search-input" onchange="filterStudents()">
                    <option value="ALL">Class</option>
                    <option value="9">9th</option>
                    <option value="10">10th</option>
                    <option value="11">11th</option>
                    <option value="12">12th</option>
                </select>
                <select id="filterSec" class="search-input" onchange="filterStudents()">
                    <option value="ALL">Sec</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
        </div>

        <!-- Student List Container -->
        <div class="student-list-container" id="studentListContainer">
            <div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Loading database...</div>
        </div>

        <!-- See More Button -->
        <div class="see-more-container">
            <button id="seeMoreBtn" class="see-more-btn animated-btn" onclick="loadMoreStudents()" style="display:none;">
                <i class="fa-solid fa-chevron-down"></i> See More Students
            </button>
        </div>

    </div>

    <!-- Edit Modal Overlay -->
    <div class="modal-overlay" id="editStudentModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-pen"></i> Edit Profile Data</h3>
                <button class="modal-close animated-btn" onclick="closeModal('editStudentModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editDocId">
                <div class="modal-field">
                    <label>Full Name</label>
                    <input type="text" id="editName" class="modal-input">
                </div>
                <div class="modal-field">
                    <label>Registered Contact (Read-only)</label>
                    <input type="text" id="editContact" class="modal-input" readonly style="opacity: 0.6; cursor: not-allowed;">
                </div>
                <div class="form-row">
                    <div class="modal-field">
                        <label>Roll Number</label>
                        <input type="number" id="editRoll" class="modal-input">
                    </div>
                    <div class="modal-field">
                        <label>Section</label>
                        <select id="editSec" class="modal-input">
                            <option value="A">Sec A</option>
                            <option value="B">Sec B</option>
                            <option value="C">Sec C</option>
                            <option value="D">Sec D</option>
                        </select>
                    </div>
                </div>
                <button class="btn-save animated-btn" onclick="updateStudentProfile()">
                    <i class="fa-solid fa-floppy-disk"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStudents = [];
        let visibleCount = 5;

        window.onload = function() {
            loadStudents();
        };

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function loadStudents() {
            db.collection('users').onSnapshot(snapshot => {
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const role = (data.role || data.user_role || '').toString().toLowerCase();
                    if (role !== 'teacher' && role !== 'admin') {
                        allStudents.push({ id: doc.id, ...data });
                    }
                });
                visibleCount = 5; // Reset count on load
                renderStudents();
            });
        }

        function filterStudents() {
            visibleCount = 5; // Reset count on search/filter
            renderStudents();
        }

        function loadMoreStudents() {
            visibleCount += 5;
            renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('studentListContainer');
            const searchVal = document.getElementById('searchBox').value.toLowerCase();
            const classVal = document.getElementById('filterClass').value;
            const secVal = document.getElementById('filterSec').value;

            const filtered = allStudents.filter(s => {
                const name = (s.username || s.fullName || s.name || '').toLowerCase();
                const contact = (s.phone || s.email || s.id || '').toLowerCase();
                const cls = (s.studentClass || s.class || '').toString();
                const sec = (s.section || s.sec || '').toString().toUpperCase();

                const matchesSearch = name.includes(searchVal) || contact.includes(searchVal);
                const matchesClass = (classVal === 'ALL' || cls.includes(classVal));
                const matchesSec = (secVal === 'ALL' || sec === secVal);

                return matchesSearch && matchesClass && matchesSec;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-data"><i class="fa-solid fa-user-slash"></i> No students match your criteria.</div>`;
                document.getElementById('seeMoreBtn').style.display = 'none';
                return;
            }

            container.innerHTML = '';
            let visibleList = filtered.slice(0, visibleCount);

            visibleList.forEach(s => {
                const name = s.username || s.fullName || s.name || 'Unnamed Student';
                const contactInfo = s.phone || s.email || s.id || 'No Contact';
                const roll = s.rollNo || s.roll || 'N/A';
                const cls = s.studentClass || s.class || 'N/A';
                const sec = s.section || s.sec || 'A';

                container.innerHTML += `
                    <div class="student-card fade-in animated-btn">
                        <div class="student-header">
                            <div class="student-title">
                                <h3><i class="fa-solid fa-user-graduate"></i> ${name}</h3>
                            </div>
                            <div class="badge-status">Roll: ${roll}</div>
                        </div>
                        <div class="student-desc-box">
                            <div><i class="fa-solid fa-envelope"></i> ${contactInfo}</div>
                            <div><i class="fa-solid fa-chalkboard-user"></i> Class: ${cls}th</div>
                            <div><i class="fa-solid fa-layer-group"></i> Section: ${sec}</div>
                        </div>
                        <div class="student-footer">
                            <button class="action-btn edit animated-btn" onclick="openEditModal('${s.id}', '${name.replace(/'/g, "\\'")}', '${contactInfo}', '${roll}', '${sec}')">
                                <i class="fa-solid fa-pen"></i> Edit Profile
                            </button>
                            <button class="action-btn delete animated-btn" onclick="deleteStudent('${s.id}')">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('seeMoreBtn').style.display = (filtered.length > visibleCount) ? 'inline-flex' : 'none';
        }

        function openEditModal(id, name, contact, roll, sec) {
            document.getElementById('editDocId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editContact').value = contact;
            document.getElementById('editRoll').value = roll !== 'N/A' ? roll : '';
            document.getElementById('editSec').value = sec || 'A';
            openModal('editStudentModal');
        }

        async function updateStudentProfile() {
            const docId = document.getElementById('editDocId').value;
            const name = document.getElementById('editName').value.trim();
            const roll = document.getElementById('editRoll').value.trim();
            const sec = document.getElementById('editSec').value;

            if (!name) return alert("Student name is required!");

            try {
                await db.collection('users').doc(docId).update({
                    username: name,
                    rollNo: roll,
                    section: sec,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Profile updated successfully.");
                closeModal('editStudentModal');
            } catch (e) {
                alert("Failed to update profile.");
            }
        }

        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student account permanently?")) return;
            try {
                await db.collection('users').doc(id).delete();
            } catch (e) {
                alert("Failed to delete user account.");
            }
        }
    </script>
</body>
</html>
