<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Students - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #070d19;
            --card: #0f172a;
            --primary: #38bdf8;
            --text: #ffffff;
            --subtext: #94a3b8;
            --border: rgba(56, 189, 248, 0.25);
        }

        /* Front-End Security: Disable Text Selection & Dragging */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-drag: none; 
        }

        input, textarea, select { user-select: auto; }

        /* PC & Mobile Responsive Fix (Desktop friendly width + Mobile 100dvh) */
        html, body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 80%);
            z-index: -1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .container { 
            width: 100%; 
            max-width: 950px; /* PC पर शानदार चौड़ाई, मोबाइल पर ऑटो फिट */
            padding-bottom: 40px; 
            animation: fadeIn 0.4s ease-out; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Top Bar */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 18px 22px; background: rgba(15, 23, 42, 0.85); 
            border: 1px solid var(--border); border-radius: 14px; 
            margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            backdrop-filter: blur(8px); 
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; color: var(--text); }
        .brand i { color: var(--primary); font-size: 20px; background: rgba(56, 189, 248, 0.1); padding: 9px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.2); }
        
        .btn-home { 
            background: rgba(56, 189, 248, 0.1); color: var(--primary); 
            border: 1px solid var(--border); padding: 9px 16px; border-radius: 10px; 
            font-size: 13px; font-weight: 600; text-decoration: none; 
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; cursor: pointer; 
        }
        .btn-home:hover { background: var(--primary); color: var(--bg); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }

        /* Section Card */
        .card {
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 10px;
        }

        /* Search & Filter Row */
        .filter-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            outline: none;
            color-scheme: dark;
            transition: all 0.3s ease;
        }

        .input-box:focus {
            border-color: var(--primary);
            background: rgba(30, 41, 59, 0.6);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        select.input-box option { background-color: var(--card); color: var(--text); }

        /* Student List Elements */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .student-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .student-item:hover {
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(30, 41, 59, 0.85);
        }

        .student-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 3px;
        }

        .student-info p {
            font-size: 11.5px;
            color: var(--subtext);
        }

        .student-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-action {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-action:hover { background: var(--primary); color: var(--bg); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-delete:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--subtext);
            font-size: 13px;
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
        }

        /* Modal Popup */
        .modal { display: none; position: fixed; inset: 0; background: rgba(7, 13, 25, 0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-content { 
            background: var(--card); width: 100%; max-width: 500px; 
            border-radius: 20px; border: 1px solid var(--border); overflow: hidden; 
            display: flex; flex-direction: column; max-height: 85vh; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); transform: scale(0.95); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .modal.active .modal-content { transform: scale(1); }
        
        .modal-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; background: rgba(56, 189, 248, 0.05); }
        .modal-header h2 { font-size: 17px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .close-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--subtext); width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; }
        .close-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; transform: rotate(90deg); }

        .modal-body { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        label { font-size: 11.5px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }

        @media (max-width: 600px) {
            .filter-row { grid-template-columns: 1fr; }
            .container { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- UI Security Guard -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>

    <div class="container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-users-gear"></i>
                <span>Student Profiles Management</span>
            </div>
            <!-- Exact file link name matching dashboard -->
            <a href="teacher_dashboard.html" class="btn-home">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <!-- Student Database Card -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-address-book"></i> Enrolled Students Directory
            </div>

            <!-- Search and Filter Row -->
            <div class="filter-row">
                <input type="text" id="searchBox" class="input-box" placeholder="Search by name or email..." oninput="filterStudents()">
                <select id="filterClass" class="input-box" onchange="filterStudents()">
                    <option value="ALL">All Classes</option>
                    <option value="9">Class 9th</option>
                    <option value="10">Class 10th</option>
                    <option value="11">Class 11th</option>
                    <option value="12">Class 12th</option>
                </select>
                <select id="filterSec" class="input-box" onchange="filterStudents()">
                    <option value="ALL">All Sec</option>
                    <option value="A">Sec A</option>
                    <option value="B">Sec B</option>
                    <option value="C">Sec C</option>
                    <option value="D">Sec D</option>
                </select>
            </div>

            <!-- Student List Container -->
            <div id="studentListContainer" class="student-list">
                <div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Loading students directory...</div>
            </div>
        </div>

    </div>

    <!-- Edit Student Modal -->
    <div class="modal" id="editStudentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-user-pen"></i> Edit Student Profile</h2>
                <button class="close-btn" onclick="closeModal('editStudentModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editDocId">
                <div>
                    <label>Full Name</label>
                    <input type="text" id="editName" class="input-box">
                </div>
                <div>
                    <label>Email Address</label>
                    <input type="email" id="editEmail" class="input-box" readonly style="opacity: 0.7;">
                </div>
                <div class="form-row">
                    <div>
                        <label>Roll Number</label>
                        <input type="number" id="editRoll" class="input-box">
                    </div>
                    <div>
                        <label>Section</label>
                        <select id="editSec" class="input-box">
                            <option value="A">Sec A</option>
                            <option value="B">Sec B</option>
                            <option value="C">Sec C</option>
                            <option value="D">Sec D</option>
                        </select>
                    </div>
                </div>
                <button class="action-btn" onclick="updateStudentProfile()">
                    <i class="fa-solid fa-floppy-disk"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStudents = [];

        window.onload = function() {
            loadStudents();
        };

        function openModal(id) { 
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }
        
        function closeModal(id) { 
            const modal = document.getElementById(id);
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function loadStudents() {
            db.collection('users').onSnapshot(snapshot => {
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const role = (data.role || data.user_role || '').toString().toLowerCase();
                    if (role !== 'teacher' && role !== 'admin') {
                        allStudents.push({ id: doc.id, ...data });
                    }
                });
                renderStudents(allStudents);
            });
        }

        function renderStudents(list) {
            const container = document.getElementById('studentListContainer');
            if (list.length === 0) {
                container.innerHTML = `<div class="no-data"><i class="fa-solid fa-user-slash"></i> No student profiles found.</div>`;
                return;
            }

            container.innerHTML = '';
            list.forEach(s => {
                const name = s.username || s.fullName || s.name || 'Unnamed Student';
                const email = s.email || s.id || 'N/A';
                const roll = s.rollNo || s.roll || 'N/A';
                const cls = s.studentClass || s.class || 'N/A';
                const sec = s.section || s.sec || 'A';

                container.innerHTML += `
                    <div class="student-item">
                        <div class="student-info">
                            <h4>${name} (Roll: ${roll})</h4>
                            <p>Email: ${email} • Class: ${cls}th - Sec ${sec}</p>
                        </div>
                        <div class="student-actions">
                            <button class="btn-action" onclick="openEditModal('${s.id}', '${name}', '${email}', '${roll}', '${sec}')">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                            <button class="btn-delete" onclick="deleteStudent('${s.id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterStudents() {
            const searchVal = document.getElementById('searchBox').value.toLowerCase();
            const classVal = document.getElementById('filterClass').value;
            const secVal = document.getElementById('filterSec').value;

            const filtered = allStudents.filter(s => {
                const name = (s.username || s.fullName || s.name || '').toLowerCase();
                const email = (s.email || s.id || '').toLowerCase();
                const cls = (s.studentClass || s.class || '').toString();
                const sec = (s.section || s.sec || '').toString().toUpperCase();

                const matchesSearch = name.includes(searchVal) || email.includes(searchVal);
                const matchesClass = (classVal === 'ALL' || cls.includes(classVal));
                const matchesSec = (secVal === 'ALL' || sec === secVal);

                return matchesSearch && matchesClass && matchesSec;
            });

            renderStudents(filtered);
        }

        function openEditModal(id, name, email, roll, sec) {
            document.getElementById('editDocId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editEmail').value = email;
            document.getElementById('editRoll').value = roll !== 'N/A' ? roll : '';
            document.getElementById('editSec').value = sec || 'A';
            openModal('editStudentModal');
        }

        async function updateStudentProfile() {
            const docId = document.getElementById('editDocId').value;
            const name = document.getElementById('editName').value.trim();
            const roll = document.getElementById('editRoll').value.trim();
            const sec = document.getElementById('editSec').value;

            if (!name) return alert("Student name is required!");

            try {
                await db.collection('users').doc(docId).update({
                    username: name,
                    rollNo: roll,
                    section: sec,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Student profile updated successfully!");
                closeModal('editStudentModal');
            } catch (e) {
                alert("Failed to update profile.");
            }
        }

        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student account?")) return;
            try {
                await db.collection('users').doc(id).delete();
                alert("✅ Student profile deleted.");
            } catch (e) {
                alert("Failed to delete user.");
            }
        }
    </script>
</body>
</html>
