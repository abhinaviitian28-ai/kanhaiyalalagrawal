<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Directory - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #070d19;
            --card: #0f172a;
            --primary: #38bdf8;
            --text: #ffffff;
            --subtext: #94a3b8;
            --border: rgba(56, 189, 248, 0.25);
        }

        /* Security & Core Resets */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-drag: none;
            /* गंदी डंडी (Scrollbar) को हमेशा के लिए छिपाने का कोड */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }

        input, textarea, select { user-select: auto; }

        /* Hide Webkit Scrollbar */
        ::-webkit-scrollbar { display: none; width: 0; background: transparent; }

        /* 100dvh & Mobile Scroll Glitch Fix */
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 15px;
            position: relative;
            overscroll-behavior-y: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 80%);
            z-index: -1;
        }

        /* Reference Sizing: Perfect Laptop Width (950px) */
        .container {
            width: 100%;
            max-width: 950px;
            padding-bottom: 30px;
        }

        /* --- ANIMATIONS --- */
        .animated-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .animated-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2); }
        .animated-btn:active { transform: scale(0.96); }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.5);
            padding: 16px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; color: var(--text); }
        .brand i { background: rgba(56, 189, 248, 0.1); padding: 10px; border-radius: 10px; color: var(--primary); font-size: 18px; border: 1px solid rgba(56, 189, 248, 0.2); }

        .btn-dashboard {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }
        .btn-dashboard:hover { background: var(--primary); color: var(--bg); }

        /* Main Directory Card */
        .directory-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 12px;
        }

        /* Filter Row */
        .filter-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-bar-wrapper { position: relative; width: 100%; }
        .search-bar-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--subtext); font-size: 13px; }

        .input-box {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            outline: none;
            transition: 0.3s;
            color-scheme: dark;
        }
        .search-input { padding-left: 38px; }
        .input-box:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); background: rgba(30, 41, 59, 0.8); }
        select.input-box option { background: var(--card); color: var(--text); }

        /* Original Student List Styles */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .student-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .student-item:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(30, 41, 59, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .student-info { flex: 1; min-width: 0; }
        .student-info h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .student-info h4 span {
            font-size: 11.5px;
            color: var(--primary);
            background: rgba(56, 189, 248, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .student-info p { font-size: 12.5px; color: var(--subtext); line-height: 1.5; }

        .student-actions { display: flex; gap: 10px; flex-shrink: 0; }

        .action-btn {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .action-btn:hover { background: var(--primary); color: var(--bg); }
        
        .action-btn.delete {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .action-btn.delete:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .no-data { text-align: center; padding: 40px; color: var(--subtext); font-size: 13.5px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px; background: rgba(0,0,0,0.2); }

        /* See More Button */
        .see-more-container { text-align: center; margin-top: 15px; }
        .see-more-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .see-more-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--primary); color: var(--primary); }

        /* Modal Overlay & Card */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 13, 25, 0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px; opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 500px; padding: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.6); transform: scale(0.95); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; max-height: 85vh; }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 15px; }
        .modal-header h3 { font-size: 17px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .modal-close { background: transparent; border: none; color: var(--subtext); font-size: 20px; cursor: pointer; transition: 0.2s; }
        .modal-close:hover { color: #ef4444; }

        .modal-body { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-right: 5px; margin-bottom: 20px; }
        .modal-body label { font-size: 11.5px; color: var(--subtext); text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-save { background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s ease; }
        .btn-save:hover { background: var(--primary); color: var(--bg); box-shadow: 0 6px 18px rgba(56, 189, 248, 0.3); }

        /* Strict Mobile View Responsiveness (650px from Reference) */
        @media (max-width: 650px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
            .btn-dashboard { width: 100%; justify-content: center; }
            .filter-row { grid-template-columns: 1fr; gap: 12px; }
            .student-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .student-actions { width: 100%; justify-content: flex-end; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Security Guard -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>

    <div class="container fade-in">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-users-viewfinder"></i>
                <span>Student Directory Panel</span>
            </div>
            <a href="teacher_dashboard.html" class="btn-dashboard animated-btn">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <!-- Directory Main Card -->
        <div class="directory-card fade-in">
            <div class="section-title">
                <i class="fa-solid fa-address-book"></i> Enrolled Students Database
            </div>

            <!-- Search and Filter Row -->
            <div class="filter-row">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchBox" class="input-box search-input" placeholder="Search by name, email or phone..." onkeyup="filterStudents()">
                </div>
                <select id="filterClass" class="input-box" onchange="filterStudents()">
                    <option value="ALL">All Classes</option>
                    <option value="9">Class 9th</option>
                    <option value="10">Class 10th</option>
                    <option value="11">Class 11th</option>
                    <option value="12">Class 12th</option>
                </select>
                <select id="filterSec" class="input-box" onchange="filterStudents()">
                    <option value="ALL">All Sections</option>
                    <option value="A">Section A</option>
                    <option value="B">Section B</option>
                    <option value="C">Section C</option>
                    <option value="D">Section D</option>
                </select>
            </div>

            <!-- Student List Container -->
            <div id="studentListContainer" class="student-list">
                <div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Loading database...</div>
            </div>

            <!-- See More Button -->
            <div class="see-more-container">
                <button id="seeMoreBtn" class="see-more-btn animated-btn" onclick="loadMoreStudents()" style="display:none;">
                    <i class="fa-solid fa-chevron-down"></i> See More Students
                </button>
            </div>
        </div>

    </div>

    <!-- Edit Student Modal -->
    <div class="modal-overlay" id="editStudentModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-pen"></i> Edit Profile Data</h3>
                <button class="modal-close animated-btn" onclick="closeModal('editStudentModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editDocId">
                <div>
                    <label>Full Name</label>
                    <input type="text" id="editName" class="input-box">
                </div>
                <div>
                    <label>Registered Contact (Read-only)</label>
                    <input type="text" id="editContact" class="input-box" readonly style="opacity: 0.6; cursor: not-allowed; background: rgba(0,0,0,0.2);">
                </div>
                <div class="form-row">
                    <div>
                        <label>Roll Number</label>
                        <input type="number" id="editRoll" class="input-box">
                    </div>
                    <div>
                        <label>Section</label>
                        <select id="editSec" class="input-box">
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                        </select>
                    </div>
                </div>
            </div>
            <button class="btn-save animated-btn" onclick="updateStudentProfile()">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStudents = [];
        let visibleCount = 5;

        window.onload = function() {
            loadStudents();
        };

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function loadStudents() {
            db.collection('users').onSnapshot(snapshot => {
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const role = (data.role || data.user_role || '').toString().toLowerCase();
                    // Filters out admins & teachers
                    if (role !== 'teacher' && role !== 'admin') {
                        allStudents.push({ id: doc.id, ...data });
                    }
                });
                visibleCount = 5; // Reset count
                renderStudents();
            });
        }

        function filterStudents() {
            visibleCount = 5; // Reset count on search
            renderStudents();
        }

        function loadMoreStudents() {
            visibleCount += 5;
            renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('studentListContainer');
            const searchVal = document.getElementById('searchBox').value.toLowerCase();
            const classVal = document.getElementById('filterClass').value;
            const secVal = document.getElementById('filterSec').value;

            const filtered = allStudents.filter(s => {
                const name = (s.username || s.fullName || s.name || '').toLowerCase();
                const contact = (s.phone || s.email || s.id || '').toLowerCase();
                const cls = (s.studentClass || s.class || '').toString();
                const sec = (s.section || s.sec || '').toString().toUpperCase();

                const matchesSearch = name.includes(searchVal) || contact.includes(searchVal);
                const matchesClass = (classVal === 'ALL' || cls.includes(classVal));
                const matchesSec = (secVal === 'ALL' || sec === secVal);

                return matchesSearch && matchesClass && matchesSec;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-data"><i class="fa-solid fa-user-slash"></i> No students match your search criteria.</div>`;
                document.getElementById('seeMoreBtn').style.display = 'none';
                return;
            }

            container.innerHTML = '';
            let visibleList = filtered.slice(0, visibleCount);

            visibleList.forEach(s => {
                const name = s.username || s.fullName || s.name || 'Unnamed Student';
                const contactInfo = s.phone || s.email || s.id || 'No Contact Info';
                const roll = s.rollNo || s.roll || 'N/A';
                const cls = s.studentClass || s.class || 'N/A';
                const sec = s.section || s.sec || 'A';

                container.innerHTML += `
                    <div class="student-item fade-in">
                        <div class="student-info">
                            <h4><i class="fa-solid fa-user-graduate"></i> ${name} <span>Roll: ${roll}</span></h4>
                            <p>Contact: ${contactInfo} &nbsp;•&nbsp; Class: ${cls}th (Sec ${sec})</p>
                        </div>
                        <div class="student-actions">
                            <button class="action-btn edit animated-btn" onclick="openEditModal('${s.id}', '${name.replace(/'/g, "\\'")}', '${contactInfo}', '${roll}', '${sec}')">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                            <button class="action-btn delete animated-btn" onclick="deleteStudent('${s.id}')">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('seeMoreBtn').style.display = (filtered.length > visibleCount) ? 'inline-flex' : 'none';
        }

        function openEditModal(id, name, contact, roll, sec) {
            document.getElementById('editDocId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editContact').value = contact;
            document.getElementById('editRoll').value = roll !== 'N/A' ? roll : '';
            document.getElementById('editSec').value = sec || 'A';
            openModal('editStudentModal');
        }

        async function updateStudentProfile() {
            const docId = document.getElementById('editDocId').value;
            const name = document.getElementById('editName').value.trim();
            const roll = document.getElementById('editRoll').value.trim();
            const sec = document.getElementById('editSec').value;

            if (!name) return alert("Student name is required!");

            try {
                await db.collection('users').doc(docId).update({
                    username: name,
                    rollNo: roll,
                    section: sec,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Profile updated successfully.");
                closeModal('editStudentModal');
            } catch (e) {
                alert("Failed to update profile.");
            }
        }

        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student account permanently?")) return;
            try {
                await db.collection('users').doc(id).delete();
            } catch (e) {
                alert("Failed to delete user account.");
            }
        }
    </script>
</body>
</html>
