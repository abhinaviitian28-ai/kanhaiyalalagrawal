<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Overview - SSKL</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body { 
      background-color: #070d19;
      min-height: 100vh; 
      color: #ffffff; 
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 75%);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 720px;
      animation: softFadeIn 0.25s ease-out;
    }

    @keyframes softFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.75);
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }

    .brand i {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 8px;
      border-radius: 10px;
      font-size: 15px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn-dashboard {
      text-decoration: none;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-dashboard:hover {
      background: rgba(56, 189, 248, 0.25);
      transform: translateY(-1px);
    }
    .btn-dashboard:active { transform: scale(0.97); }

    /* Overview Banner Card */
    .card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .rate-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .rate-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .rate-num {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .rate-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-neutral {
      background: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .badge-safe {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
    }

    .badge-warning {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }

    /* Counter Grid */
    .counter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .counter-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .counter-box:hover {
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    .c-val {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .c-lbl {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Section Titles */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      margin: 16px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Month Strips */
    .month-strips-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .month-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .month-strip:hover {
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(30, 41, 59, 0.9);
      transform: translateX(2px);
    }

    .month-strip.current-month {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }

    .strip-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .strip-icon {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 10px;
      border-radius: 10px;
      font-size: 15px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .strip-text h3 {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .current-tag {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .strip-text p {
      font-size: 11px;
      color: #94a3b8;
    }

    .strip-arrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #38bdf8;
      font-weight: 600;
    }

    /* Empty State */
    .empty-state {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 32px 20px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .empty-state i {
      font-size: 32px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .empty-state h3 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 11.5px;
      color: #94a3b8;
      max-width: 360px;
      line-height: 1.5;
    }

    /* Calendar Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 14px;
      backdrop-filter: blur(5px);
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      animation: modalZoom 0.2s ease-out;
    }

    @keyframes modalZoom {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .close-modal-btn:hover { color: #ffffff; }

    .legend-wrapper {
      display: flex;
      justify-content: space-around;
      background: rgba(30, 41, 59, 0.7);
      padding: 8px 6px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 10.5px;
      color: #cbd5e1;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .legend-item { display: flex; align-items: center; gap: 5px; }
    .dot-icon { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-present { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }
    .dot-absent { background: #ef4444; box-shadow: 0 0 6px #ef444480; }
    .dot-leave { background: #eab308; box-shadow: 0 0 6px #eab30880; }
    .dot-holiday { background: #64748b; }

    .calendar-days-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      aspect-ratio: 1;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      position: relative;
      transition: all 0.15s ease;
    }

    .day-cell.empty { background: transparent; border-color: transparent; }

    .status-dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 2px; }

    .day-cell.is-present { background: rgba(34, 197, 94, 0.18); border-color: rgba(34, 197, 94, 0.4); }
    .day-cell.is-present .status-dot { background: #22c55e; }

    .day-cell.is-absent { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.4); }
    .day-cell.is-absent .status-dot { background: #ef4444; }

    .day-cell.is-leave { background: rgba(234, 179, 8, 0.18); border-color: rgba(234, 179, 8, 0.4); }
    .day-cell.is-leave .status-dot { background: #eab308; }

    .day-cell.is-holiday .status-dot { background: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Attendance Overview</span>
      </div>
      <a href="database.html" class="btn-dashboard">
        <i class="fa-solid fa-house"></i> Dashboard
      </a>
    </div>

    <!-- Main Overview Card -->
    <div class="card">
      <div class="rate-header">
        <div class="rate-box">
          <span class="rate-num" id="overallPercentage">--%</span>
          <span class="rate-label">Overall Rate</span>
        </div>
        <div class="status-badge badge-neutral" id="statusBadge">
          <i class="fa-solid fa-circle-info"></i> No Data Yet
        </div>
      </div>

      <div class="counter-grid">
        <div class="counter-box">
          <div class="c-val" style="color: #38bdf8;" id="statTotal">0</div>
          <div class="c-lbl">Total Days</div>
        </div>
        <div class="counter-box">
          <div class="c-val" style="color: #4ade80;" id="statPresent">0</div>
          <div class="c-lbl">Present</div>
        </div>
        <div class="counter-box">
          <div class="c-val" style="color: #f87171;" id="statAbsent">0</div>
          <div class="c-lbl">Absent</div>
        </div>
      </div>
    </div>

    <!-- Month List Container -->
    <div id="attendanceStripsContainer"></div>

  </div>

  <!-- Calendar Popup Modal -->
  <div class="modal-overlay" id="calendarModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-calendar-alt"></i>
          <span id="modalMonthTitle">Month Attendance</span>
        </div>
        <button class="close-modal-btn" onclick="closeCalendarModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="legend-wrapper">
        <div class="legend-item"><span class="dot-icon dot-present"></span> Present</div>
        <div class="legend-item"><span class="dot-icon dot-absent"></span> Absent</div>
        <div class="legend-item"><span class="dot-icon dot-leave"></span> Leave</div>
        <div class="legend-item"><span class="dot-icon dot-holiday"></span> Holiday</div>
      </div>

      <div class="calendar-days-header">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
      authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
      projectId: "ss-kanhaiyalal-agrawal",
      storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
      messagingSenderId: "776171239833",
      appId: "1:776171239833:web:39eea44420db97384b3b08",
      measurementId: "G-TQKTRTKBEJ"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function getActiveUserIdentifier() {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const val = (localStorage.getItem(key) || '').trim().toLowerCase();
        if (val.includes('@')) return val;
      }
      return (localStorage.getItem('loggedInUser') || '').trim().toLowerCase();
    }

    let myIdentifiers = [];
    let attendanceData = {};
    const monthNamesArr = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    async function initAttendancePortal() {
      const activeUser = getActiveUserIdentifier();
      myIdentifiers = [activeUser];

      try {
        const uSnap = await db.collection('users').get();
        uSnap.forEach(d => {
          const data = d.data();
          const dEmail = (data.email || '').toLowerCase().trim();
          const dUser = (data.username || '').toLowerCase().trim();
          const dRoll = String(data.rollNo || data.rollNumber || data.roll || '');

          if (dEmail === activeUser || dUser === activeUser || d.id.toLowerCase() === activeUser) {
            if (d.id) myIdentifiers.push(d.id.toLowerCase());
            if (dEmail) myIdentifiers.push(dEmail);
            if (dUser) myIdentifiers.push(dUser);
            if (dRoll && dRoll !== '0') myIdentifiers.push(dRoll);
          }
        });
      } catch(e) {
        console.warn("User fetch warning:", e);
      }

      myIdentifiers = [...new Set(myIdentifiers.filter(Boolean))];
      loadAttendanceRecords();
    }

    async function loadAttendanceRecords() {
      try {
        const snap = await db.collection("attendance").get();
        attendanceData = {};

        // Track unique attendance date -> status (Prevents phantom duplicate absents)
        const dateToStatusMap = {};

        snap.forEach(doc => {
          const d = doc.data();
          const sMap = d.students || {};

          let status = null;

          for (const [key, val] of Object.entries(sMap)) {
            const k = String(key).toLowerCase().trim();
            if (myIdentifiers.includes(k)) {
              status = val;
              break;
            }
          }

          if (status) {
            const dateStr = d.date || (doc.id.includes('_') ? doc.id.split('_').pop() : '');
            if (!dateStr || !dateStr.includes('-')) return;

            // Store status by unique date
            dateToStatusMap[dateStr] = status;
          }
        });

        let grandTotal = 0;
        let grandPresent = 0;
        let grandAbsent = 0;

        // Process strictly unique dates
        Object.entries(dateToStatusMap).forEach(([dateStr, status]) => {
          const [yearStr, monthStr, dayStr] = dateStr.split('-');
          const year = parseInt(yearStr);
          const monthIndex = parseInt(monthStr) - 1;
          const dayNum = parseInt(dayStr);

          if (isNaN(year) || isNaN(monthIndex) || isNaN(dayNum)) return;

          const monthKey = `${monthNamesArr[monthIndex]} ${year}`;

          if (!attendanceData[monthKey]) {
            attendanceData[monthKey] = {
              month: monthKey,
              year: year,
              monthIndex: monthIndex,
              totalDays: new Date(year, monthIndex + 1, 0).getDate(),
              startDayOffset: new Date(year, monthIndex, 1).getDay(),
              records: {}
            };
          }

          const st = (status === 'P') ? 'present' : ((status === 'A') ? 'absent' : 'leave');
          attendanceData[monthKey].records[dayNum] = st;

          grandTotal++;
          if (st === 'present') grandPresent++;
          else if (st === 'absent') grandAbsent++;
        });

        updateOverviewStats(grandTotal, grandPresent, grandAbsent);
        initAttendanceView();

      } catch(err) {
        console.error("Attendance Error:", err);
      }
    }

    function initAttendanceView() {
      const container = document.getElementById('attendanceStripsContainer');
      if (!container) return;
      container.innerHTML = '';

      const monthKeys = Object.keys(attendanceData);
      if (!monthKeys.length) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-calendar-minus"></i>
            <h3>No Attendance Records Published Yet</h3>
            <p>When teachers update attendance, monthwise records and overall percentage will be calculated here automatically.</p>
          </div>
        `;
        return;
      }

      monthKeys.sort((a, b) => {
        const itemA = attendanceData[a];
        const itemB = attendanceData[b];
        return (itemB.year * 12 + itemB.monthIndex) - (itemA.year * 12 + itemA.monthIndex);
      });

      const currentMonthKey = monthKeys[0];

      let html = `
        <div class="section-title">
          <i class="fa-solid fa-clock"></i> Current Academic Month
        </div>
        <div class="month-strips-wrapper">
          ${createStripHTML(currentMonthKey, true)}
        </div>
      `;
        if (monthKeys.length > 1) {
        html += `
          <div class="section-title">
            <i class="fa-solid fa-history"></i> Previous Months History
          </div>
          <div class="month-strips-wrapper">
        `;
        for (let i = 1; i < monthKeys.length; i++) {
          html += createStripHTML(monthKeys[i], false);
        }
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    function createStripHTML(monthKey, isCurrent) {
      const data = attendanceData[monthKey] || { records: {} };
      let pCount = 0, totalCount = 0;

      Object.values(data.records || {}).forEach(st => {
        if (st === 'present') { pCount++; totalCount++; }
        else if (st === 'absent' || st === 'leave') { totalCount++; }
      });

      const monthRate = totalCount > 0 ? ((pCount / totalCount) * 100).toFixed(1) : 0;
      const activeClass = isCurrent ? 'current-month' : '';
      const activeTag = isCurrent ? '<span class="current-tag">ACTIVE</span>' : '';
      const iconBg = isCurrent ? '' : 'style="background: rgba(255,255,255,0.05); color: #cbd5e1; border-color: rgba(255,255,255,0.1);"';

      return `
        <div class="month-strip ${activeClass}" onclick="openCalendarModal('${monthKey}')">
          <div class="strip-info">
            <div class="strip-icon" ${iconBg}><i class="fa-solid fa-calendar-day"></i></div>
            <div class="strip-text">
              <h3>${monthKey} ${activeTag}</h3>
              <p>Present: ${pCount} / ${totalCount} Days • Rate: ${monthRate}%</p>
            </div>
          </div>
          <div class="strip-arrow">
            <span>View Calendar</span>
            <i class="fa-solid fa-chevron-right"></i>
          </div>
        </div>
      `;
    }

    function updateOverviewStats(total, present, absent) {
      const totalElem = document.getElementById('statTotal');
      const presentElem = document.getElementById('statPresent');
      const absentElem = document.getElementById('statAbsent');
      const badge = document.getElementById('statusBadge');
      const percentElem = document.getElementById('overallPercentage');

      if (totalElem) totalElem.innerText = total;
      if (presentElem) presentElem.innerText = present;
      if (absentElem) absentElem.innerText = absent;

      if (!percentElem || !badge) return;

      if (total === 0) {
        percentElem.innerText = '--%';
        percentElem.style.color = '#94a3b8';
        badge.className = 'status-badge badge-neutral';
        badge.innerHTML = `<i class="fa-solid fa-circle-info"></i> No Data Yet`;
      } else {
        const rate = ((present / total) * 100).toFixed(1);
        percentElem.innerText = `${rate}%`;

        if (rate >= 75) {
          percentElem.style.color = '#22c55e';
          badge.className = 'status-badge badge-safe';
          badge.innerHTML = `<i class="fa-solid fa-circle-check"></i> Safe Zone`;
        } else {
          percentElem.style.color = '#f87171';
          badge.className = 'status-badge badge-warning';
          badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Shortage Warning`;
        }
      }
    }

    function openCalendarModal(monthName) {
      const modal = document.getElementById('calendarModal');
      const title = document.getElementById('modalMonthTitle');
      const grid = document.getElementById('calendarGrid');

      if (!modal || !title || !grid) return;

      title.innerText = `${monthName} Attendance Calendar`;
      grid.innerHTML = '';

      const data = attendanceData[monthName];
      if (!data) return;

      for (let i = 0; i < (data.startDayOffset || 0); i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        grid.appendChild(emptyCell);
      }

      const totalDays = data.totalDays || 30;
      for (let day = 1; day <= totalDays; day++) {
        const status = (data.records && data.records[day]) ? data.records[day] : 'holiday';
        const cell = document.createElement('div');
        cell.className = `day-cell is-${status}`;
        cell.innerHTML = `<span>${day}</span><span class="status-dot"></span>`;
        grid.appendChild(cell);
      }

      modal.style.display = 'flex';
    }

    function closeCalendarModal() {
      const modal = document.getElementById('calendarModal');
      if (modal) modal.style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('calendarModal');
      if (event.target === modal) closeCalendarModal();
    };

    window.onload = initAttendancePortal;
  </script>
</body>
</html>
